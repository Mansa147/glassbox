name: Validation Suite

on:
  schedule:
    # Run quarterly: Jan, Apr, Jul, Oct on the 1st at 00:00 UTC
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Run validation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build glassbox binary
        run: |
          go build -o bin/glassbox ./cmd/glassbox

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: Build TypeScript artifacts (if present)
        run: |
          npm run build --if-present || true

      - name: Make validation runner executable
        run: |
          chmod +x scripts/run-validation-suite.sh || true

      - name: Run validation suite
        id: run_validation
        env:
          GLASSBOX_BINARY: ${{ github.workspace }}/bin/glassbox
          ARTIFACT_MAX_MB: '50'
        run: |
          scripts/run-validation-suite.sh || true

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ github.run_id }}
          path: ci-artifacts/validation/
          retention-days: 30
