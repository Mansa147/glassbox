name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. v1.2.3). Defaults to git tag.'
        required: false

permissions:
  contents: write

# ── Secret required for manifest signing ────────────────────────────────────
# Repository secret: MANIFEST_SIGNING_KEY
#   Value: a PKCS#8 PEM Ed25519 private key.
#   Generate with:
#     openssl genpkey -algorithm ed25519 -out release-key.pem
#   Store ONLY the private key value as the secret. Never commit it.
#   The corresponding public key is embedded in every manifest.json so
#   verifiers do not need access to any CI secret.

jobs:
  # ── Build Go cross-compiled binaries ────────────────────────────────────────
  build-go:
    name: Build Go (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: glassbox-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: glassbox-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: glassbox-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: glassbox-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: glassbox-windows-amd64.exe

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source_date_epoch }}
        run: |
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/dotandev/glassbox/internal/version.Version=${{ steps.version.outputs.version }}' \
              -X 'github.com/dotandev/glassbox/internal/version.CommitSHA=${{ steps.version.outputs.commit }}' \
              -X 'github.com/dotandev/glassbox/internal/version.BuildDate=${{ steps.version.outputs.build_date }}'" \
            -o dist/release/${{ matrix.artifact }} \
            ./cmd/glassbox

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.artifact }}
          path: dist/release/${{ matrix.artifact }}
          retention-days: 1

  # ── Build TypeScript / Node artifacts ───────────────────────────────────────
  build-ts:
    name: Build TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run TypeScript tests
        run: npm test -- --passWithNoTests

      - name: Upload TS dist
        uses: actions/upload-artifact@v4
        with:
          name: ts-dist
          path: dist/
          retention-days: 1

  # ── Run Go tests ─────────────────────────────────────────────────────────────
  test-go:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

  # ── Package: collect artifacts, checksums, archives ─────────────────────────
  package:
    name: Package release
    runs-on: ubuntu-latest
    needs: [build-go, build-ts, test-go]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Download all Go binaries
        uses: actions/download-artifact@v4
        with:
          pattern: go-*
          path: dist/release
          merge-multiple: true

      - name: Download TS dist
        uses: actions/download-artifact@v4
        with:
          name: ts-dist
          path: dist/ts

      - name: Write version metadata
        run: |
          printf 'version=%s\ncommit=%s\nbuild_date=%s\nsource_date_epoch=%s\n' \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.commit }}" \
            "${{ steps.version.outputs.build_date }}" \
            "${{ steps.version.outputs.source_date_epoch }}" \
            > dist/release/version.txt

      - name: Create reproducible archives
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source_date_epoch }}
        run: |
          cd dist/release
          for f in glassbox-linux-* glassbox-darwin-*; do
            [ -f "$f" ] || continue
            chmod +x "$f"
            tar --sort=name \
                --owner=0 --group=0 --numeric-owner \
                --mtime="@${SOURCE_DATE_EPOCH}" \
                -czf "${f}.tar.gz" "$f"
            echo "  archived $f"
          done
          for f in glassbox-windows-*.exe; do
            [ -f "$f" ] || continue
            zip --no-dir-entries -X -9 "${f%.exe}.zip" "$f"
            echo "  archived $f"
          done

      - name: Generate checksums (sorted for reproducibility)
        run: |
          cd dist/release
          sha256sum *.tar.gz *.zip version.txt | LC_ALL=C sort > checksums.sha256
          cat checksums.sha256

      - name: Verify release artifacts
        run: bash scripts/verify-release.sh dist/release

      - name: Upload packaged release
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/release/
          retention-days: 30

  # ── Generate SBOM: merge Go modules, Cargo crates, npm packages ─────────────
  generate-sbom:
    name: Generate SBOM (SPDX 2.3)
    runs-on: ubuntu-latest
    needs: [package]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download packaged release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/release

      - name: Install npm dependencies (for package-lock.json)
        # We need package-lock.json to be present and up-to-date.
        # `npm ci --ignore-scripts` is safe here — we only need the lockfile.
        run: npm ci --ignore-scripts --prefer-offline

      - name: Build generate-sbom tool
        run: go build -o bin/generate-sbom ./cmd/generate-sbom

      - name: Collect Go module list
        run: go list -m -json all > /tmp/go-modules.json
        env:
          GOFLAGS: "-mod=readonly"

      - name: Generate SBOM
        id: sbom
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ steps.version.outputs.commit }}
          SBOM_TOOL: ${{ github.workspace }}/bin/generate-sbom
          GO_MODULES_JSON: /tmp/go-modules.json
          CARGO_LOCK: simulator/Cargo.lock
          PACKAGE_LOCK: package-lock.json
          DIST_DIR: dist/release
        run: |
          SBOM_FILE=$(bash scripts/generate-sbom.sh dist/release)
          echo "sbom_file=${SBOM_FILE}" >> "$GITHUB_OUTPUT"
          echo "sbom_name=$(basename "${SBOM_FILE}")" >> "$GITHUB_OUTPUT"
          echo "SBOM written: ${SBOM_FILE}"

      - name: Verify SBOM against lockfiles
        run: |
          bash scripts/verify-sbom.sh "${{ steps.sbom.outputs.sbom_file }}" \
            --go-modules /tmp/go-modules.json \
            --cargo-lock  simulator/Cargo.lock \
            --package-lock package-lock.json \
            --strict

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.version.outputs.version }}
          path: ${{ steps.sbom.outputs.sbom_file }}
          retention-days: 30

      - name: Add SBOM to release package
        # Merge the SBOM into the release artifact bundle so sign-manifest can
        # hash it along with the binaries.
        run: cp "${{ steps.sbom.outputs.sbom_file }}" dist/release/

      - name: Re-upload release package with SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-with-sbom-${{ steps.version.outputs.version }}
          path: dist/release/
          retention-days: 30

  # ── Vulnerability scan: osv-scanner across all three ecosystems ─────────────
  sbom-vuln-scan:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    needs: [generate-sbom]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ steps.version.outputs.version }}
          path: dist/release

      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@latest

      - name: Run vulnerability scan
        id: vuln
        run: |
          mkdir -p vuln-reports
          bash scripts/sbom-vuln-scan.sh \
            --go-sum        go.sum \
            --cargo-lock    simulator/Cargo.lock \
            --package-lock  package-lock.json \
            --sbom          dist/release/$(ls dist/release/*.spdx.json 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "") \
            --output-dir    vuln-reports \
            --fail-on       HIGH \
            --format        table

      - name: Upload vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuln-scan-${{ steps.version.outputs.version }}
          path: vuln-reports/
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('vuln-reports/osv-scan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vuln-reports/osv-scan.sarif
          category: osv-scanner

  # ── Sign manifest: hash every artifact, sign with Ed25519, verify ────────────
  sign-manifest:
    name: Sign release manifest
    runs-on: ubuntu-latest
    needs: [generate-sbom, sbom-vuln-scan]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Download packaged release artifacts
        uses: actions/download-artifact@v4
        with:
          # Prefer the bundle that already contains the SBOM (produced by generate-sbom).
          # Fall back to the base package artifact when SBOM generation was skipped.
          pattern: release-with-sbom-${{ steps.version.outputs.version }}
          path: dist/release
          merge-multiple: true

      - name: Fallback — download base release if SBOM bundle missing
        if: hashFiles('dist/release/checksums.sha256') == ''
        uses: actions/download-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/release

      - name: Build manifest tool
        run: |
          go build -o bin/generate-release-manifest ./cmd/generate-release-manifest
          echo "  manifest tool built: $(bin/generate-release-manifest --help 2>&1 | head -1 || true)"

      - name: Generate and sign manifest
        env:
          GLASSBOX_MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ steps.version.outputs.commit }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          SIGNER_IDENTITY: ci-pipeline
        run: |
          if [ -z "${GLASSBOX_MANIFEST_SIGNING_KEY}" ]; then
            echo "::warning::MANIFEST_SIGNING_KEY secret is not set — skipping manifest signing."
            echo "  To enable signing, add a MANIFEST_SIGNING_KEY repository secret."
            echo "  Generate a key with: openssl genpkey -algorithm ed25519 -out release-key.pem"
            exit 0
          fi
          MANIFEST_TOOL="$(pwd)/bin/generate-release-manifest" \
            bash scripts/sign-manifest.sh dist/release

      - name: Verify manifest (offline check)
        # Run the pure-bash/python3 verifier — no Go toolchain needed.
        run: |
          if [ ! -f dist/release/manifest.json ]; then
            echo "::warning::manifest.json not present (signing was skipped); skipping verification."
            exit 0
          fi
          bash scripts/verify-manifest.sh dist/release/manifest.json dist/release

      - name: Upload signed manifest
        if: hashFiles('dist/release/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-manifest-${{ steps.version.outputs.version }}
          path: dist/release/manifest.json
          retention-days: 30

      - name: Upload full release with manifest
        if: hashFiles('dist/release/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-with-manifest-${{ steps.version.outputs.version }}
          path: dist/release/
          retention-days: 30

  # ── Publish: create GitHub Release with all artifacts ────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [sign-manifest]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts (with manifest if present)
        uses: actions/download-artifact@v4
        with:
          # Prefer the bundle that includes manifest.json; fall back to the
          # base package artifact when signing was skipped.
          pattern: release-with-manifest-${{ steps.version.outputs.version }}
          path: dist/release
          merge-multiple: true

      - name: Fallback — download base release if manifest bundle missing
        if: hashFiles('dist/release/checksums.sha256') == ''
        uses: actions/download-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body: |
            ## Glassbox ${{ steps.version.outputs.version }}

            **Commit:** `${{ steps.version.outputs.commit }}`
            **Built:** ${{ steps.version.outputs.build_date }}

            ### Installation

            Download the binary for your platform, make it executable, and place it on your `PATH`.

            ```bash
            # Linux (amd64)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/glassbox-linux-amd64.tar.gz | tar xz
            chmod +x glassbox-linux-amd64
            sudo mv glassbox-linux-amd64 /usr/local/bin/glassbox

            # macOS (Apple Silicon)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/glassbox-darwin-arm64.tar.gz | tar xz
            chmod +x glassbox-darwin-arm64
            sudo mv glassbox-darwin-arm64 /usr/local/bin/glassbox
            ```

            ### Verify checksums

            ```bash
            sha256sum --check checksums.sha256
            ```

            ### Verify signed manifest

            ```bash
            # Download the manifest and verification script
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/manifest.json
            curl -LO https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/verify-manifest.sh

            # Run offline verification (requires python3 + pip install cryptography)
            bash verify-manifest.sh manifest.json .
            ```

            ### Verify the SBOM

            ```bash
            # Download the SBOM and verification script
            curl -LO "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/glassbox-${{ steps.version.outputs.version }}.spdx.json"
            curl -LO https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/verify-sbom.sh

            # Structural validation + manifest coverage check (requires python3)
            bash verify-sbom.sh "glassbox-${{ steps.version.outputs.version }}.spdx.json" \
              --manifest manifest.json
            ```

            See [docs/sbom.md](https://github.com/${{ github.repository }}/blob/main/docs/sbom.md) for full SBOM documentation.

            See [docs/release-manifest.md](https://github.com/${{ github.repository }}/blob/main/docs/release-manifest.md) for full verification instructions.
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.spdx.json
            dist/release/checksums.sha256
            dist/release/version.txt
            dist/release/manifest.json

  # ── Determinism check: same hash on Linux and macOS ─────────────────────────
  determinism:
    name: Canonical JSON determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run canonical JSON tests
        run: go test -v -run 'TestCanonicalJSON|TestGenerate_DeterministicHash|TestMarshalCanonical' ./internal/cmd/...

      - name: Save hash output
        run: |
          go test -v -run 'TestGenerate_DeterministicHash' ./internal/cmd/... \
            | tee hash_output_${{ matrix.os }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hash-output-${{ matrix.os }}
          path: hash_output_${{ matrix.os }}.txt
          retention-days: 1

  compare-determinism:
    name: Compare canonical hashes across platforms
    runs-on: ubuntu-latest
    needs: determinism

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-output-*
          merge-multiple: true

      - name: Compare outputs
        run: |
          echo "=== Ubuntu output ==="
          cat hash_output_ubuntu-latest.txt
          echo ""
          echo "=== macOS output ==="
          cat hash_output_macos-latest.txt
          echo ""
          # Both should contain PASS (no FAIL lines)
          if grep -q 'FAIL' hash_output_ubuntu-latest.txt || grep -q 'FAIL' hash_output_macos-latest.txt; then
            echo "[FAIL] determinism test failed on at least one platform"
            exit 1
          fi
          echo "[PASS] canonical JSON is deterministic across platforms"

  # ── Reproducibility check: build linux-amd64 twice, compare SHA-256 ─────────
  # Acceptance criterion: "CI runs a reproducibility check for at least one target."
  reproducibility:
    name: Reproducible build (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false   # disable cache — each build must be independent

      - name: Resolve build inputs
        id: inputs
        run: |
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always --dirty)"  >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)"                      >> "$GITHUB_OUTPUT"
          # Derive build date from epoch so it is identical in both builds.
          EPOCH="$(git log -1 --format=%ct)"
          echo "build_date=$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build 1 (fresh GOPATH + GOCACHE)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOPATH: /tmp/gopath-build1
          GOCACHE: /tmp/gocache-build1
          SOURCE_DATE_EPOCH: ${{ steps.inputs.outputs.source_date_epoch }}
        run: |
          mkdir -p /tmp/gopath-build1 /tmp/gocache-build1 dist/build1
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/dotandev/glassbox/internal/version.Version=${{ steps.inputs.outputs.version }}' \
              -X 'github.com/dotandev/glassbox/internal/version.CommitSHA=${{ steps.inputs.outputs.commit }}' \
              -X 'github.com/dotandev/glassbox/internal/version.BuildDate=${{ steps.inputs.outputs.build_date }}'" \
            -o dist/build1/glassbox-linux-amd64 \
            ./cmd/glassbox
          # Reproducible archive
          tar --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${{ steps.inputs.outputs.source_date_epoch }}" \
              -czf dist/build1/glassbox-linux-amd64.tar.gz \
              -C dist/build1 glassbox-linux-amd64

      - name: Build 2 (separate GOPATH + GOCACHE)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOPATH: /tmp/gopath-build2
          GOCACHE: /tmp/gocache-build2
          SOURCE_DATE_EPOCH: ${{ steps.inputs.outputs.source_date_epoch }}
        run: |
          mkdir -p /tmp/gopath-build2 /tmp/gocache-build2 dist/build2
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/dotandev/glassbox/internal/version.Version=${{ steps.inputs.outputs.version }}' \
              -X 'github.com/dotandev/glassbox/internal/version.CommitSHA=${{ steps.inputs.outputs.commit }}' \
              -X 'github.com/dotandev/glassbox/internal/version.BuildDate=${{ steps.inputs.outputs.build_date }}'" \
            -o dist/build2/glassbox-linux-amd64 \
            ./cmd/glassbox
          tar --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${{ steps.inputs.outputs.source_date_epoch }}" \
              -czf dist/build2/glassbox-linux-amd64.tar.gz \
              -C dist/build2 glassbox-linux-amd64

      - name: Compare build outputs
        run: |
          echo "SOURCE_DATE_EPOCH : ${{ steps.inputs.outputs.source_date_epoch }}"
          echo "Version           : ${{ steps.inputs.outputs.version }}"
          echo ""

          HASH1_BIN=$(sha256sum dist/build1/glassbox-linux-amd64     | awk '{print $1}')
          HASH2_BIN=$(sha256sum dist/build2/glassbox-linux-amd64     | awk '{print $1}')
          HASH1_ARC=$(sha256sum dist/build1/glassbox-linux-amd64.tar.gz | awk '{print $1}')
          HASH2_ARC=$(sha256sum dist/build2/glassbox-linux-amd64.tar.gz | awk '{print $1}')

          FAIL=0

          if [ "${HASH1_BIN}" = "${HASH2_BIN}" ]; then
            echo "  [PASS] binary:  ${HASH1_BIN}"
          else
            echo "  [FAIL] binary differs:"
            echo "         build1: ${HASH1_BIN}"
            echo "         build2: ${HASH2_BIN}"
            FAIL=1
          fi

          if [ "${HASH1_ARC}" = "${HASH2_ARC}" ]; then
            echo "  [PASS] archive: ${HASH1_ARC}"
          else
            echo "  [FAIL] archive differs:"
            echo "         build1: ${HASH1_ARC}"
            echo "         build2: ${HASH2_ARC}"
            FAIL=1
          fi

          if [ "${FAIL}" -ne 0 ]; then
            echo ""
            echo "Reproducibility check failed."
            echo "See docs/reproducible-builds.md#troubleshooting for next steps."
            exit 1
          fi

          echo ""
          echo "Result: build is reproducible for linux/amd64."

      - name: Upload build outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-diff-${{ github.run_id }}
          path: |
            dist/build1/
            dist/build2/
          retention-days: 3
