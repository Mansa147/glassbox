#
# obs-doc-validation.yml
#
# Validates that observability documentation tables and examples match the
# canonical source-of-truth in docs/observability-manifest.json.
#
# CI fails when:
#   - A Prometheus metric is added or removed without updating docs
#   - A progress event phase, status, or field is changed without updating docs
#   - A stable error code is added without documenting it
#   - A deprecation lacks a compatibility note
#
# Source of truth: docs/observability-manifest.json

name: Observability Documentation Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/observability-manifest.json'
      - 'docs/observability-troubleshooting.md'
      - 'docs/progress-events.md'
      - 'internal/progress/**'
      - 'internal/metrics/**'
      - 'internal/obsvalidate/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/observability-manifest.json'
      - 'docs/observability-troubleshooting.md'
      - 'docs/progress-events.md'
      - 'internal/progress/**'
      - 'internal/metrics/**'
      - 'internal/obsvalidate/**'

concurrency:
  group: obs-doc-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GLASSBOX_TELEMETRY: "false"

jobs:
  validate:
    name: Validate observability documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run observability validation suite
        run: |
          go test -v -count=1 -timeout=2m ./internal/obsvalidate/...

      - name: Summary
        if: failure()
        run: |
          echo "::error::Observability documentation is out of sync with the manifest."
          echo "::error::Update docs/observability-manifest.json or the documentation files to fix this."
