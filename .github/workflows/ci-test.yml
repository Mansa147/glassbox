#
# ci-test.yml
#
# Primary CI workflow: runs Go unit tests, integration tests, and TypeScript
# tests on every push and pull request.
#
# Failure artifact policy
# ────────────────────────
# Artifacts are uploaded ONLY when a job fails, keeping successful runs lean.
# Before upload every file is run through scripts/redact-logs.sh to strip
# common secret patterns (tokens, PEM keys, passwords, connection strings).
# See docs/ci-artifacts.md for retrieval instructions and retention details.

name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-flight runs for the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Shared defaults
# ─────────────────────────────────────────────────────────────────────────────
env:
  # Artifact upload size guard: redact-logs.sh aborts the upload if the
  # sanitized directory exceeds this many megabytes.
  ARTIFACT_MAX_MB: "50"
  # Retention (days) for failure-debug artifacts. Short enough that stale
  # sensitive data is not retained indefinitely; long enough to investigate.
  ARTIFACT_RETENTION_DAYS: "7"
  # Disable telemetry inside CI to avoid noisy data.
  GLASSBOX_TELEMETRY: "false"
  # Ensure the simulator is not accidentally picked up from PATH.
  GLASSBOX_SIM_PATH: ""

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Go unit tests
  # ───────────────────────────────────────────────────────────────────────────
  go-unit:
    name: Go unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Run tests and emit a JUnit-compatible report for GitHub Actions.
      # gotestsum produces machine-readable output; fall back to go test if
      # gotestsum fails to build (e.g. transitive-dep incompatibility).
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0
        continue-on-error: true

      - name: Run unit tests
        id: run_tests
        shell: bash
        # Write JSON output for downstream processing and JUnit XML for the
        # test report annotation step.
        run: |
          mkdir -p ci-artifacts/unit
          if gotestsum --version >/dev/null 2>&1; then
            gotestsum \
              --format testname \
              --junitfile ci-artifacts/unit/junit.xml \
              --jsonfile ci-artifacts/unit/test-output.json \
              -- -race -coverprofile=ci-artifacts/unit/coverage.out \
              ./internal/...
          else
            echo "gotestsum unavailable, falling back to go test"
            go test -race -coverprofile=ci-artifacts/unit/coverage.out ./internal/... \
              2>&1 | tee ci-artifacts/unit/test-output.log
            FALLBACK_EXIT=${PIPESTATUS[0]}
            echo '[]' > ci-artifacts/unit/test-output.json
            exit ${FALLBACK_EXIT}
          fi
        # Continue so the artifact upload step always runs even on failure.
        continue-on-error: true

      - name: Annotate test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ci-artifacts/unit/junit.xml
          check_name: "Go unit tests / ${{ matrix.os }}"
          fail_on_failure: false

      # ── Failure artifact collection ────────────────────────────────────────
      - name: Collect failure artifacts (unit)
        if: steps.run_tests.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          STAGING="ci-artifacts-staging/unit-${{ matrix.os }}"
          mkdir -p "${STAGING}"

          # Copy test output (JSON + JUnit XML).
          cp ci-artifacts/unit/junit.xml "${STAGING}/" 2>/dev/null || true
          cp ci-artifacts/unit/test-output.json "${STAGING}/" 2>/dev/null || true
          cp ci-artifacts/unit/coverage.out "${STAGING}/" 2>/dev/null || true

          # Copy any minimized trace files left by tests that call
          # trace.ExportExecutionTrace.
          find . -name "*.trace.json" -not -path "*/testdata/*" \
            -exec cp {} "${STAGING}/" \; 2>/dev/null || true

          # Redact secrets from every collected file before upload.
          bash scripts/redact-logs.sh "${STAGING}" "${ARTIFACT_MAX_MB}"

      - name: Upload failure artifacts (unit)
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failure-unit-${{ matrix.os }}-${{ github.run_id }}
          path: ci-artifacts-staging/unit-${{ matrix.os }}/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      # Fail the job after artifact upload so the PR is correctly blocked.
      - name: Fail if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # Go integration tests (require a built binary; skip simulator-dependent
  # paths when GLASSBOX_SIM_PATH is empty)
  # ───────────────────────────────────────────────────────────────────────────
  go-integration:
    name: Go integration tests
    runs-on: ubuntu-latest
    needs: go-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0
        continue-on-error: true

      - name: Build glassbox binary
        run: go build -o bin/glassbox ./cmd/glassbox

      - name: Run integration tests
        id: run_integration
        shell: bash
        env:
          GLASSBOX_BINARY: ${{ github.workspace }}/bin/glassbox
        run: |
          mkdir -p ci-artifacts/integration
          if gotestsum --version >/dev/null 2>&1; then
            gotestsum \
              --format testname \
              --junitfile ci-artifacts/integration/junit.xml \
              --jsonfile ci-artifacts/integration/test-output.json \
              -- -v -timeout 120s \
              ./integration/...
          else
            echo "gotestsum unavailable, falling back to go test"
            go test -v -timeout 120s ./integration/... \
              2>&1 | tee ci-artifacts/integration/test-output.log
            FALLBACK_EXIT=${PIPESTATUS[0]}
            echo '[]' > ci-artifacts/integration/test-output.json
            exit ${FALLBACK_EXIT}
          fi
        continue-on-error: true

      - name: Annotate integration test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ci-artifacts/integration/junit.xml
          check_name: "Go integration tests"
          fail_on_failure: false

      # ── Failure artifact collection ────────────────────────────────────────
      - name: Collect failure artifacts (integration)
        if: steps.run_integration.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          STAGING="ci-artifacts-staging/integration"
          mkdir -p "${STAGING}"

          cp ci-artifacts/integration/junit.xml "${STAGING}/" 2>/dev/null || true
          cp ci-artifacts/integration/test-output.json "${STAGING}/" 2>/dev/null || true

          # Capture the glassbox binary version for reproducibility.
          bin/glassbox version --json > "${STAGING}/glassbox-version.json" 2>/dev/null || true

          # Collect any trace files emitted during integration tests.
          find . -name "*.trace.json" -newer go.mod \
            -not -path "*/testdata/*" \
            -exec cp {} "${STAGING}/" \; 2>/dev/null || true

          # Collect any snapshot registry files.
          find . -name "*.registry.json" -newer go.mod \
            -not -path "*/testdata/*" \
            -exec cp {} "${STAGING}/" \; 2>/dev/null || true

          bash scripts/redact-logs.sh "${STAGING}" "${ARTIFACT_MAX_MB}"

      - name: Upload failure artifacts (integration)
        if: steps.run_integration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failure-integration-${{ github.run_id }}
          path: ci-artifacts-staging/integration/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Fail if integration tests failed
        if: steps.run_integration.outcome == 'failure'
        run: exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # TypeScript / Node tests
  # ───────────────────────────────────────────────────────────────────────────
  ts-test:
    name: TypeScript tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install jest-junit reporter
        run: npm install --no-save jest-junit

      - name: Run TypeScript tests
        id: run_ts
        run: |
          mkdir -p ci-artifacts/ts
          # Jest writes JSON results when --json is passed; also emit JUnit XML.
          npx jest \
            --ci \
            --forceExit \
            --json --outputFile=ci-artifacts/ts/jest-results.json \
            --reporters=default --reporters=jest-junit \
            2>&1 | tee ci-artifacts/ts/jest.log || true
          # Capture exit code separately so the artifact step still runs.
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit ${EXIT_CODE}
        env:
          JEST_JUNIT_OUTPUT_DIR: ci-artifacts/ts
          JEST_JUNIT_OUTPUT_NAME: junit.xml
        continue-on-error: true

      - name: Annotate TypeScript test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ci-artifacts/ts/junit.xml
          check_name: "TypeScript tests"
          fail_on_failure: false

      # ── Failure artifact collection ────────────────────────────────────────
      - name: Collect failure artifacts (ts)
        if: steps.run_ts.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          STAGING="ci-artifacts-staging/ts"
          mkdir -p "${STAGING}"

          cp ci-artifacts/ts/junit.xml "${STAGING}/" 2>/dev/null || true
          cp ci-artifacts/ts/jest-results.json "${STAGING}/" 2>/dev/null || true
          cp ci-artifacts/ts/jest.log "${STAGING}/" 2>/dev/null || true

          # Capture Node and npm versions for reproducibility.
          node --version > "${STAGING}/node-version.txt"
          npm --version >> "${STAGING}/node-version.txt"

          bash scripts/redact-logs.sh "${STAGING}" "${ARTIFACT_MAX_MB}"

      - name: Upload failure artifacts (ts)
        if: steps.run_ts.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failure-ts-${{ github.run_id }}
          path: ci-artifacts-staging/ts/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Fail if TypeScript tests failed
        if: steps.run_ts.outcome == 'failure'
        run: exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # Regression tests (package: internal/cmd, tagged TestRegression_*)
  # ───────────────────────────────────────────────────────────────────────────
  go-regression:
    name: Go regression tests
    runs-on: ubuntu-latest
    needs: go-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0
        continue-on-error: true

      - name: Run regression tests
        id: run_regression
        shell: bash
        run: |
          mkdir -p ci-artifacts/regression
          if gotestsum --version >/dev/null 2>&1; then
            gotestsum \
              --format testname \
              --junitfile ci-artifacts/regression/junit.xml \
              --jsonfile ci-artifacts/regression/test-output.json \
              -- -v -run TestRegression \
              ./internal/cmd/... ./integration/...
          else
            echo "gotestsum unavailable, falling back to go test"
            go test -v -run TestRegression ./internal/cmd/... ./integration/... \
              2>&1 | tee ci-artifacts/regression/test-output.log
            FALLBACK_EXIT=${PIPESTATUS[0]}
            echo '[]' > ci-artifacts/regression/test-output.json
            exit ${FALLBACK_EXIT}
          fi
        continue-on-error: true

      - name: Annotate regression test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ci-artifacts/regression/junit.xml
          check_name: "Regression tests"
          fail_on_failure: false

      - name: Collect failure artifacts (regression)
        if: steps.run_regression.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          STAGING="ci-artifacts-staging/regression"
          mkdir -p "${STAGING}"
          cp ci-artifacts/regression/junit.xml "${STAGING}/" 2>/dev/null || true
          cp ci-artifacts/regression/test-output.json "${STAGING}/" 2>/dev/null || true
          find . -name "*.trace.json" -newer go.mod \
            -not -path "*/testdata/*" \
            -exec cp {} "${STAGING}/" \; 2>/dev/null || true
          bash scripts/redact-logs.sh "${STAGING}" "${ARTIFACT_MAX_MB}"

      - name: Upload failure artifacts (regression)
        if: steps.run_regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failure-regression-${{ github.run_id }}
          path: ci-artifacts-staging/regression/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Fail if regression tests failed
        if: steps.run_regression.outcome == 'failure'
        run: exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # Byte-stable bindings verification
  # ───────────────────────────────────────────────────────────────────────────
  bindings-byte-stable:
    name: Byte-stable bindings verification
    runs-on: ubuntu-latest
    needs: go-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build glassbox binary
        run: go build -o bin/glassbox ./cmd/glassbox

      - name: Run byte-stable bindings test
        run: go test -v -run TestByteStableGeneration ./internal/bindings/...

  # ───────────────────────────────────────────────────────────────────────────
  # Summary job: all gates must pass before merge is allowed
  # ───────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI gate (all tests passed)
    runs-on: ubuntu-latest
    needs: [ go-unit, go-integration, ts-test, go-regression, bindings-byte-stable ]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          results=(
            "${{ needs.go-unit.result }}"
            "${{ needs.go-integration.result }}"
            "${{ needs.ts-test.result }}"
            "${{ needs.go-regression.result }}"
            "${{ needs.bindings-byte-stable.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "[FAIL] job result: $r"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "One or more CI jobs failed. Check the uploaded failure artifacts."
            echo "See docs/ci-artifacts.md for retrieval instructions."
            exit 1
          fi
          echo "[OK] All CI jobs passed."
