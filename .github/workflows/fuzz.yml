# fuzz.yml
#
# Fuzz testing workflow: runs fuzz targets with bounded execution and memory limits.
# This is a lightweight corpus job that runs on every push and pull request to catch
# regressions early. For more intensive fuzzing, run locally with longer durations.

name: Fuzz Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Sundays at 00:00 UTC for deeper coverage
    - cron: '0 0 * * 0'

# Cancel in-flight runs for the same branch/PR when a new commit is pushed.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fuzzing time bounds (seconds)
  FUZZ_TIME_PR: 30      # Lightweight run for PRs
  FUZZ_TIME_PUSH: 60    # Medium run for pushes
  FUZZ_TIME_SCHEDULE: 300 # Deep run for scheduled jobs
  
  # Memory limit for fuzz targets (MB)
  FUZZ_MEMORY_LIMIT: 512
  
  # Timeout for the entire fuzz job (seconds)
  FUZZ_JOB_TIMEOUT: 600
  
  # Artifact retention (days)
  ARTIFACT_RETENTION_DAYS: "7"
  
  # Disable telemetry
  GLASSBOX_TELEMETRY: "false"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # XDR decoder fuzzing
  # ───────────────────────────────────────────────────────────────────────────
  fuzz-xdr:
    name: Fuzz XDR decoder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine fuzz time
        id: fuzz_time
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "time=${FUZZ_TIME_PR}s" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            echo "time=${FUZZ_TIME_SCHEDULE}s" >> $GITHUB_OUTPUT
          else
            echo "time=${FUZZ_TIME_PUSH}s" >> $GITHUB_OUTPUT
          fi

      - name: Run XDR fuzz tests
        id: run_fuzz
        run: |
          mkdir -p ci-artifacts/fuzz-xdr
          go test -fuzz=FuzzDecodeEnvelope \
            -fuzztime=${{ steps.fuzz_time.outputs.time }} \
            -timeout=${FUZZ_JOB_TIMEOUT}s \
            -memprofile=ci-artifacts/fuzz-xdr/mem.prof \
            ./internal/simulator/ 2>&1 | tee ci-artifacts/fuzz-xdr/output.log || true
          
          # Run additional XDR fuzz targets
          go test -fuzz=FuzzXDRSafeUnmarshal \
            -fuzztime=${{ steps.fuzz_time.outputs.time }} \
            -timeout=${FUZZ_JOB_TIMEOUT}s \
            ./internal/simulator/ 2>&1 | tee -a ci-artifacts/fuzz-xdr/output.log || true
          
          go test -fuzz=FuzzDecodeDiagnosticEvent \
            -fuzztime=${{ steps.fuzz_time.outputs.time }} \
            -timeout=${FUZZ_JOB_TIMEOUT}s \
            ./internal/simulator/ 2>&1 | tee -a ci-artifacts/fuzz-xdr/output.log || true
        continue-on-error: true

      - name: Check for crashes
        id: check_crashes
        run: |
          if grep -q "crash" ci-artifacts/fuzz-xdr/output.log; then
            echo "crash_found=true" >> $GITHUB_OUTPUT
            echo "Crash detected in XDR fuzzing"
            exit 1
          else
            echo "crash_found=false" >> $GITHUB_OUTPUT
            echo "No crashes detected"
          fi
        continue-on-error: true

      - name: Upload fuzz artifacts
        if: steps.check_crashes.outputs.crash_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-xdr-crash-${{ github.run_id }}
          path: ci-artifacts/fuzz-xdr/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Fail if crash found
        if: steps.check_crashes.outputs.crash_found == 'true'
        run: exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # Decoder fuzzing (JSON, events)
  # ───────────────────────────────────────────────────────────────────────────
