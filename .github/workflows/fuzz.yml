        run: exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # Summary job: all fuzz targets must pass
  # ───────────────────────────────────────────────────────────────────────────
  fuzz-gate:
    name: Fuzz gate (all targets passed)
    runs-on: ubuntu-latest
    needs: [ fuzz-xdr, fuzz-decoder, fuzz-trace, fuzz-session, fuzz-wasm, fuzz-certificate ]
    if: always()

    steps:
      - name: Check all fuzz jobs passed
        run: |
          results=(
            "${{ needs.fuzz-xdr.result }}"
            "${{ needs.fuzz-decoder.result }}"
            "${{ needs.fuzz-trace.result }}"
            "${{ needs.fuzz-session.result }}"
            "${{ needs.fuzz-wasm.result }}"
            "${{ needs.fuzz-certificate.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "[FAIL] fuzz job result: $r"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "One or more fuzz jobs failed. Check the uploaded crash artifacts."
            echo "See testdata/fuzz/TRIAGE.md for triage instructions."
            exit 1
          fi
          echo "[OK] All fuzz jobs passed."
